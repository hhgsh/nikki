name: release-packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: ${{ matrix.arch }}-${{ matrix.branch }} release
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
        branch:
          - openwrt-25.12

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # 1. 缓存 Go 模块与编译缓存（大幅提升 Golang 项目编译速度）
      - name: Setup Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.arch }}-

      # 2. 预先开启多线程构建环境变量
      - name: Set environment variables
        run: |
          echo "GOMAXPROCS=$(nproc)" >> $GITHUB_ENV

      # 3. 执行编译
      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: nikki
          PACKAGES: mihomo-alpha mihomo-meta nikki luci-app-nikki
          INDEX: 1
          NO_REFRESH_CHECK: true
          # 传递并发编译参数给 SDK
          MAKEFLAGS: "-j$(nproc)"

      # 4. 上传产物
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: nikki-packages-${{ matrix.arch }}-${{ matrix.branch }}
          path: bin/packages/
