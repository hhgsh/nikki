name: release-packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: ${{ matrix.arch }}-${{ matrix.branch }} release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
        branch:
          - openwrt-25.12

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # 1. Go 编译与模块缓存（大幅提速）
      - name: Setup Go cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.arch }}-

      - name: Set environment variables
        run: |
          echo "GOMAXPROCS=$(nproc)" >> $GITHUB_ENV

      # 2. 执行 OpenWrt SDK 编译
      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: nikki
          PACKAGES: mihomo-alpha mihomo-meta nikki luci-app-nikki
          INDEX: 1
          NO_REFRESH_CHECK: true
          MAKEFLAGS: "-j$(nproc)"

      # 3. 筛选并整理需要发布的文件
      - name: Organize Artifacts
        run: |
          mkdir -p output
          # 搜寻编译出的所有 .apk 包并汇总到 output 目录
          find bin/packages/ -type f -name "*.apk" -exec cp {} output/ \;
          ls -la output/

      # 4. 动态生成 Release Tag 名称
      - name: Generate Release Tag Name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${github.ref_name}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v25.12-nikki-$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
          fi

      # 5. 自动创建 Release 并上传 APK
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Nikki Packages OpenWrt 25.12 (${{ env.RELEASE_TAG }})"
          files: output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
